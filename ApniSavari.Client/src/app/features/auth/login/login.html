<div class="register-container">

  <h2>Create Account</h2>

  <form (ngSubmit)="login()">

    <div class="form-group">
      <label>Email</label>
      <input
        type="text"
        name="email"
        [(ngModel)]="LoginData.email"
        required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="LoginData.password"
        required>
    </div>

    
    <button type="submit">
      Login
    </button>
  </form>

  @if (message) {
    <p class="success">{{ message }}</p>
  }

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

</div>
